[project]
name = "lattice-unroll"
version = "0.1.0"
description = "Exact winding numbers for Herculaneum scrolls from the public spiral-tracks lattice, without a spiral fit"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "PyMaxflow>=1.3",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
]

[project.scripts]
lattice-unroll = "lattice_unroll.lattice:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
